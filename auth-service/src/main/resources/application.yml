server:
  port: 7081

spring:
  application:
    name: auth-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

otel:
  service:
    name: auth-service
  exporter:
    otlp:
      endpoint: http://otel-collector:4318
  instrumentation:
    logback-appender:
      enabled: true
    spring-webmvc:
      enabled: true
