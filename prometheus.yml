global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: load-generator
    static_configs:
      - targets: ["load-generator:8090"]

  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:7080"]
        labels: { service: gateway }

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:7081"]
        labels: { service: auth }

  - job_name: account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["account-service:7082"]
        labels: { service: account }

  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["transaction-service:7083"]
        labels: { service: transaction }

  - job_name: card-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["card-service:7084"]
        labels: { service: card }

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:7085"]
        labels: { service: payment }
