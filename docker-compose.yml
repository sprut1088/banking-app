version: "3.9"

services:

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "14317:4317"
      - "14318:4318"
      - "18889:8889"

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    depends_on:
      - otel-collector
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "7081:7081"

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    depends_on:
      - otel-collector
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "7082:7082"

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    depends_on:
      - otel-collector
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "7083:7083"

  card-service:
    build:
      context: .
      dockerfile: card-service/Dockerfile
    depends_on:
      - otel-collector
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "7084:7084"

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    depends_on:
      - otel-collector
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "7085:7085"

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    depends_on:
      - otel-collector
      - auth-service
      - account-service
      - transaction-service
      - card-service
      - payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "7080:7080"

  load-generator:
    build: ./load-generator
    depends_on:
      - gateway-service
    environment:
      GATEWAY_URL: http://gateway-service:7080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      TPS_PER_FLOW: 3
    ports:
      - "8090:8090"

  frontend:
    build: ./frontend
    depends_on:
      - gateway-service
      - load-generator
      - otel-collector
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "5174:80"
